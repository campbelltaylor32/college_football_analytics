[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cfb_cover_model"
version = "0.1.0"
description = "Walk-forward-validated ATS spread-cover classifier: dimensionality reduction plus a classification/regression stacked ensemble."
requires-python = ">=3.12"
dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "scikit-learn>=1.4",
    "scipy>=1.12",
    "pyyaml>=6.0",
    "pyarrow>=15.0",
    "joblib>=1.3",
    "matplotlib>=3.8",
    "seaborn>=0.13",
    "cfbd>=5.0",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
boosting = ["xgboost>=2.0", "lightgbm>=4.3", "catboost>=1.2"]
dev = ["pytest>=8.0", "pytest-cov>=5.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
