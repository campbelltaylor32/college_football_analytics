services:
  api:
    build: .
    image: cfb_cover_model:latest
    command: uvicorn cfb_cover_model.api.app:create_app --factory --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    volumes:
      - ./outputs/models:/app/outputs/models
      - ./outputs/monitoring:/app/outputs/monitoring
      - ./outputs/predictions:/app/outputs/predictions
      - ./data/processed:/app/data/processed
    env_file:
      - ../.env
      - .env
    restart: unless-stopped

  scheduler:
    build: .
    image: cfb_cover_model:latest
    command: python scripts/run_scheduler.py
    volumes:
      - ./outputs/models:/app/outputs/models
      - ./outputs/monitoring:/app/outputs/monitoring
      - ./outputs/predictions:/app/outputs/predictions
      - ./data/processed:/app/data/processed
    env_file:
      - ../.env
      - .env
    environment:
      - API_BASE_URL=http://api:8000
    depends_on:
      - api
    restart: unless-stopped
