[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cfb-rb-rushing-model"
version = "0.1.0"
description = "Leakage-safe weekly regression pipeline predicting running back rushing yards from pre-kickoff-known rolling player/team/opponent information."
requires-python = ">=3.11,<3.14"
readme = "README.md"
dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "sqlalchemy>=2.0",
    "pymysql>=1.1",
    "scikit-learn>=1.4",
    "matplotlib>=3.8",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "joblib>=1.3",
    "tabulate>=0.9",
    "pyarrow>=15.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov"]
boosting = ["xgboost>=2.0", "lightgbm>=4.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["src"]
