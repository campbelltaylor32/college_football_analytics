# Season boundaries -- NOT copied from the sibling cfb_win_total_model/cfb_spread_model
# projects (which use full_feature_start_season=2015, driven by team_talent availability).
# This project's binding constraint is different: plays.rusher_player_name completeness.
# Verified live during planning (see docs/assumptions_and_limitations.md):
#   - 2013: 100% NULL rusher_player_name on rush plays -- unusable.
#   - 2014-2019, 2021-2024: clean (0-6% NULL).
#   - 2020: COVID-shortened, excluded for the standard reason.
#   - 2025: clean through week 8 (1.6-3.7% NULL), then collapses to 97-99.5% NULL from week 9
#     on. Re-confirmed live post-season (2026-08-09) via a fresh cfbfastR::cfbd_pbp_data() pull
#     against the CollegeFootballData API itself: week 5 still resolves names (35/36 rush
#     plays), week 9 still resolves ZERO (0/69) -- this is a persistent gap in the upstream
#     source's structured player-attribution field, not a transient ingestion-run issue a
#     re-pull would fix. play_text still contains the raw name ("#33 C.Tabb rush..."), so it's
#     recoverable later via a jersey-number parser if ever needed, but is NOT parsed today.
#   - 2025 is therefore used as the final holdout season, but ONLY weeks 1-8 (see
#     final_holdout_max_week below) -- weeks 9+ are dropped post-build precisely because their
#     target/player-feature rows would otherwise be silently (and wrongly) zero-filled by
#     targets.py's LEFT JOIN, indistinguishable from a genuine zero-carry game.
target_season: 2025
full_feature_start_season: 2014
excluded_seasons: [2020]

min_train_seasons: 4
first_validation_season: 2019
walk_forward_validation_seasons: [2019, 2021, 2022, 2023]
final_holdout_season: 2025
# Applied by scripts/build_modeling_dataset.py as a post-build row filter: rows for
# final_holdout_season with week > final_holdout_max_week are dropped before the dataset is
# saved, so no downstream consumer (training, EDA, feature registry) can accidentally see the
# data-gap weeks. Null/absent means no cap.
final_holdout_max_week: 8

random_seed: 42

# Rushing yards in a single game is never negative in this dataset's construction (sacks are a
# separate play_type, not folded into rushing yardage) -- clip at 0, no upper clip (breakaway
# games are real and shouldn't be capped).
clip_predictions:
  min_yards: 0

prediction_interval_method: oof_residual_quantiles
prediction_interval_levels: [0.10, 0.90]   # 80% interval

models:
  baselines:
    - player_rolling3_avg
    - player_season_avg
    - position_avg
  candidates:
    - ols
    - ridge
    - lasso
    - elasticnet
    - random_forest
    - gradient_boosting
    - hist_gradient_boosting
    - xgboost
    - lightgbm

# Hyperparameter grids used by modeling/tuning.py's GridSearchCV with explicit season-ordered
# inner CV splits (never sklearn's default random/K-fold) -- same rationale as the sibling
# projects' config/modeling.yaml. The tree-ensemble grids (random_forest through lightgbm) are
# intentionally near-single-point for the initial validation run -- this dataset's largest
# fold has ~19k rows and the sibling projects' exhaustive-search rationale (grids cheap enough
# to search fully) does not hold at this row count for 200-500-tree ensembles. Widen these
# once the pipeline itself is validated end-to-end; this is a runtime-cost choice, not a
# statement that these are the best hyperparameters.
hyperparam_grids:
  ridge:
    alpha: [0.1, 1.0, 10.0, 100.0]
  lasso:
    alpha: [0.001, 0.01, 0.1, 1.0]
  elasticnet:
    alpha: [0.01, 0.1, 1.0]
    l1_ratio: [0.2, 0.5, 0.8]
  random_forest:
    n_estimators: [150]
    max_depth: [5]
  gradient_boosting:
    n_estimators: [150]
    max_depth: [3]
    learning_rate: [0.05]
  hist_gradient_boosting:
    max_iter: [150]
    max_depth: [5]
    learning_rate: [0.05]
  xgboost:
    n_estimators: [150]
    max_depth: [4]
    learning_rate: [0.05]
  lightgbm:
    n_estimators: [150]
    max_depth: [5]
    learning_rate: [0.05]
