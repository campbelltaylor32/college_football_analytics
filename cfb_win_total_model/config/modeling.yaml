# Season boundaries are grounded in verified DB coverage (see docs/assumptions_and_limitations.md):
# team_talent starts 2015, returning_production starts 2014, so the earliest season with a
# complete feature set (using t-1 game stats + t talent/returning production) is 2015.
target_season: 2025
full_feature_start_season: 2015

# 2020 is COVID-shortened (games row count ~1/3 of neighboring seasons) -- excluded from
# both training and validation by default. See data_validation.check_covid_season_flag.
excluded_seasons: [2020]

min_train_seasons: 4
first_validation_season: 2019
walk_forward_validation_seasons: [2019, 2021, 2022, 2023, 2024]
final_holdout_season: 2025

random_seed: 42

clip_predictions:
  min_wins: 0
  max_wins: scheduled_games   # resolved per team-season at predict time, not a fixed int

prediction_interval_method: oof_residual_quantiles
prediction_interval_levels: [0.10, 0.90]   # 80% interval

models:
  baselines:
    - overall_mean
    - prev_season_wins
    - rolling_3yr_avg
    - conference_avg
    - ols_prior_wins_talent
  candidates:
    - ols
    - ridge
    - lasso
    - elasticnet
    - random_forest
    - gradient_boosting
    - hist_gradient_boosting
    - xgboost
    - lightgbm

# Hyperparameter grids used by modeling/tuning.py's GridSearchCV. Kept small: the full
# training set is on the order of 1,000-1,300 team-season rows, so exhaustive search is cheap
# and a Randomized search is unnecessary.
hyperparam_grids:
  ridge:
    alpha: [0.1, 1.0, 10.0, 100.0]
  lasso:
    alpha: [0.001, 0.01, 0.1, 1.0]
  elasticnet:
    alpha: [0.01, 0.1, 1.0]
    l1_ratio: [0.2, 0.5, 0.8]
  random_forest:
    n_estimators: [200, 500]
    max_depth: [3, 5, 8, null]
  gradient_boosting:
    n_estimators: [100, 300]
    max_depth: [2, 3, 4]
    learning_rate: [0.03, 0.1]
  hist_gradient_boosting:
    max_iter: [100, 300]
    max_depth: [3, 5, null]
    learning_rate: [0.03, 0.1]
  xgboost:
    n_estimators: [100, 300]
    max_depth: [3, 5]
    learning_rate: [0.03, 0.1]
  lightgbm:
    n_estimators: [100, 300]
    max_depth: [3, 5, -1]
    learning_rate: [0.03, 0.1]
