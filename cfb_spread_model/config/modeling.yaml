# Season boundaries verified against the actual CSV this session: coverage is 2015-2025,
# 2020 is COVID-shortened (91 games vs 183-268 in neighboring seasons) -- excluded from both
# training and validation, same justification the sibling cfb_win_total_model/ project uses.
full_feature_start_season: 2015
excluded_seasons: [2020]

min_train_seasons: 4
walk_forward_validation_seasons: [2019, 2021, 2022, 2023, 2024]
final_holdout_season: 2025   # a fully completed season in this dataset

random_seed: 42

# Precision is the primary objective throughout feature selection, hyperparameter tuning, and
# threshold selection (see feature_selection/precision_scoring.py, modeling/tuning.py,
# modeling/threshold_selection.py) -- this replaces every scoring="roc_auc" call site in the
# current notebook (Python Scripts/CFB_Gambling_Model.ipynb).
precision_objective:
  # Must flag >=10% of a season's games as bets. Deliberately set BELOW the current model's
  # realized ~25% coverage at threshold 0.6, so the search isn't pre-constrained to match the
  # status quo -- and high enough to rule out a degenerate "1 ultra-confident pick" solution.
  min_coverage_floor: 0.10
  # Superset of the current notebook's [0.5..0.95] sweep, extended toward the high-precision /
  # low-coverage regime this project is explicitly optimizing for.
  candidate_thresholds: [0.50, 0.55, 0.60, 0.65, 0.70, 0.75, 0.80, 0.85, 0.90]

models:
  # New relative to the current notebook (which has no baselines at all): always_favorite tests
  # whether the model beats "just bet the favorite," majority_class is the trivial floor, and
  # logistic_no_selection (all 1044 raw columns, no Stage 1/2 pruning) stress-tests whether any
  # precision gain actually comes from feature selection or just from model family.
  baselines: [always_favorite, majority_class, logistic_no_selection]
  candidates: [logistic_regression, random_forest, gradient_boosting, xgboost, lightgbm, catboost]

# Hyperparameter grids used by modeling/tuning.py's GridSearchCV with explicit season-ordered
# inner CV splits (never sklearn's default random/K-fold). Kept small and exhaustive-search-cheap,
# same rationale as cfb_win_total_model/config/modeling.yaml.
hyperparam_grids:
  logistic_regression:
    # penalty intentionally omitted -- LogisticRegression's default is already L2, and
    # sklearn>=1.8 deprecates the `penalty` param in favor of `l1_ratio`/`C` (verified against
    # the installed sklearn 1.9.0, which warns on `penalty='l2'`).
    C: [0.01, 0.1, 1.0, 10.0]
  random_forest:
    n_estimators: [200, 500]
    max_depth: [3, 5, 8, null]
  gradient_boosting:
    n_estimators: [100, 300]
    max_depth: [2, 3, 4]
    learning_rate: [0.03, 0.1]
  xgboost:
    n_estimators: [100, 300]
    max_depth: [3, 5]
    learning_rate: [0.03, 0.1]
  lightgbm:
    n_estimators: [100, 300]
    max_depth: [3, 5, -1]
    learning_rate: [0.03, 0.1]
  catboost:
    iterations: [200, 500]
    depth: [4, 6]
    learning_rate: [0.03, 0.1]
