[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cfb-spread-model"
version = "0.1.0"
description = "Precision-optimized, leakage-tested pipeline predicting whether the home team covers the spread, built on top of the existing Data/CFB_Gambling_Predictors_Final_PBP.csv feature set."
requires-python = ">=3.11,<3.14"
readme = "README.md"
dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "scikit-learn>=1.4",
    "scipy>=1.12",
    "matplotlib>=3.8",
    "pyyaml>=6.0",
    "joblib>=1.3",
    "tabulate>=0.9",
    "pyarrow>=15.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov"]
boosting = ["xgboost>=2.0", "lightgbm>=4.0", "catboost>=1.2"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["src"]
