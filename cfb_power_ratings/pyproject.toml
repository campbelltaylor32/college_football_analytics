[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cfb-power-ratings"
version = "0.1.0"
description = "Weekly-updating FBS team power ratings, seeded by a preseason model prior and blended with in-season opponent-adjusted results."
requires-python = ">=3.11,<3.14"
readme = "README.md"
dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "scipy>=1.12",
    "sqlalchemy>=2.0",
    "pymysql>=1.1",
    "scikit-learn>=1.4",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "joblib>=1.3",
    "pyarrow>=15.0",
    "cfbd>=5.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov"]
boosting = ["xgboost>=2.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["src"]
