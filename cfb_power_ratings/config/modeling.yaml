# Season boundaries, grounded in verified DB coverage (games/plays start 2013, team_talent
# starts 2015 -- see docs/assumptions_and_limitations.md). The historical SRS target
# (srs.py::build_historical_srs_table) can be computed back to 2013 since it only needs
# `games`, but the preseason feature set needs both season-t talent (>=2015) AND
# `program_history_trailing_seasons` (3) years of prior actual SRS, which pushes the first
# season with a fully-populated feature row to 2016 (SRS(2015)/(2014)/(2013) all computable).
srs_history_start_season: 2013
full_feature_start_season: 2016

# 2020 is COVID-shortened -- excluded from training/validation, same convention as every
# sibling project.
excluded_seasons: [2020]

min_train_seasons: 4
first_validation_season: 2021
walk_forward_validation_seasons: [2021, 2022, 2023, 2024]
final_holdout_season: 2025

random_seed: 42

candidate_models:
  - overall_mean          # baseline: predict league-average SRS (0) every time
  - prev_season_srs       # baseline: predict last season's actual SRS unchanged
  - ridge
  - gradient_boosting
  - xgboost                # only used if the `boosting` extra is installed

# --- SRS / rating-engine parameters (srs.py, rating_engine.py) ---
srs:
  iterations: 200
  non_fbs_pool_name: "generic_low_major"
  # Home-field advantage is estimated live from data by default
  # (srs.estimate_home_field_advantage) -- this override exists only for tests/reproducing a
  # specific historical run without re-querying the DB.
  hfa_override: null

rating_engine:
  # Each team's preseason prior counts as this many "phantom games" against a league-average
  # opponent in the in-season blended update (rating_engine.py::update_ratings). May be
  # fractional. Prior weight = phantom / (phantom + games_played): 1 puts a 4-game team at
  # 20% preseason / 80% results (5 was the original default: ~56% / 44%). Not rigorously
  # tuned; see scripts/backtest_season.py's sensitivity sweep and
  # docs/assumptions_and_limitations.md.
  default_phantom_games: 1
  phantom_games_sweep: [1, 3, 5, 8]

# --- Play-by-play efficiency blend (efficiency.py, rating_engine.py) ---
efficiency:
  enabled: true
  # Share of each game's margin taken from the actual score; the rest comes from its
  # efficiency-implied margin (net EPA/play + net success rate, both sides of the ball,
  # converted to points by a regression fit on seasons strictly before the one being rated).
  # 1.0 = scoring-only (the pre-efficiency rating). 0.75 had the lowest mean MAE vs actual
  # margin in the 2021-2025 backtest sweep (tied-best at phantom_games 1, best at 3) -- the
  # gain over 1.0 is small (~0.03-0.1 pts), largest at low phantom_games and in weeks 1-4.
  scoring_weight: 0.75
  scoring_weight_sweep: [1.0, 0.75, 0.5, 0.25, 0.0]
  calibration_start_season: 2016
  # Drop plays in period >= min_period where the offense's pre-snap win probability is
  # outside [wp_low, wp_high]. Plays with no wp_before are kept.
  garbage_time:
    min_period: 3
    wp_low: 0.05
    wp_high: 0.95
